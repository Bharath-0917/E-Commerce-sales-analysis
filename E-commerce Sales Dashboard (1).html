<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-commerce Sales Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#F3F2EA;--card:#fff;--ink:#1A1A14;--mut:#6B6A5C;--line:#E6E4D4;--side:#FFD500;--sink:#1A1A14;--c1:#C9A400;--c2:#25793A;--c3:#C8431F;--c4:#6FB06F;--c5:#4A7BA8;--c6:#F2C94C;--c7:#9AA68A;--c8:#B7B4A0;--ft:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12130E;--card:#1C1E15;--ink:#F1F0E4;--mut:#A4A28E;--line:#2E3022;--side:#E9C400;--sink:#14140C;--c1:#E0B800;--c2:#4CBF66;--c3:#F0794F;--c4:#86C486;--c5:#6C9CC8;--c6:#F2D26A;--c7:#AAB69A;--c8:#7F7C68;--ft:#12130E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12130E;--card:#1C1E15;--ink:#F1F0E4;--mut:#A4A28E;--line:#2E3022;--side:#E9C400;--sink:#14140C;--c1:#E0B800;--c2:#4CBF66;--c3:#F0794F;--c4:#86C486;--c5:#6C9CC8;--c6:#F2D26A;--c7:#AAB69A;--c8:#7F7C68;--ft:#12130E;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
.app{height:100%;min-height:720px;display:grid;grid-template-columns:230px 1fr;gap:14px;padding:12px}
aside{background:var(--side);color:var(--sink);border-radius:26px;padding:20px 16px;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--sink);display:grid;grid-template-columns:repeat(3,6px);align-items:end;justify-content:center;gap:3px;padding-bottom:9px}
.mark i{background:var(--side);border-radius:1px;display:block}.mark i:nth-child(1){height:8px}.mark i:nth-child(2){height:15px}.mark i:nth-child(3){height:11px}
.brand b{font-size:16px;font-weight:800;line-height:1.15;display:block}.brand span{font-size:12px;font-weight:600;opacity:.85}
.sl{border:1.5px solid color-mix(in srgb,var(--sink) 55%,transparent);border-radius:6px;padding:6px 8px 4px;margin-bottom:12px}
.sl label{display:block;font-size:12.5px;font-weight:700}
select{width:100%;border:0;background:transparent;color:var(--sink);font:600 13.5px "Plus Jakarta Sans",system-ui,sans-serif;padding:3px 0;cursor:pointer}
select option{color:#111;background:#fff}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:8px;border-radius:8px;border:1.5px solid var(--sink);background:transparent;color:var(--sink);font-weight:700;font-size:12.5px;margin-top:4px}
.btn:hover{background:var(--sink);color:var(--side)}
.sp1{flex:1}
button:focus-visible,select:focus-visible,tr:focus-visible,.fb:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 1fr 1.08fr;grid-template-rows:auto auto auto 1fr 1fr;grid-template-areas:"h h r" "k k r" "i i r" "a b r" "c b r";gap:12px;min-width:0;min-height:0}
.h{grid-area:h;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.3px;line-height:1.2}.h p{margin:0;color:var(--mut);font-size:12px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.tabs button{border:0;background:transparent;color:var(--ink);padding:7px 14px;font-weight:700;font-size:12.5px}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.ks{grid-area:k;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.is{grid-area:i;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card.in{flex-direction:row;align-items:flex-start;gap:9px;padding:8px 12px;font-size:12.5px;line-height:1.35;box-shadow:none}.in i{width:9px;height:9px;border-radius:50%;background:var(--d);margin-top:5px;flex:none}.in b{font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;min-height:0;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.card h2,.rs h2{font-size:13px;font-weight:800;margin:0 0 4px}
.kpi{border-left:5px solid var(--c2);flex-direction:row;justify-content:space-between;align-items:center;padding:9px 14px}
.kpi:first-child{background:linear-gradient(120deg,var(--card) 40%,color-mix(in srgb,var(--c1) 40%,var(--card)))}
.kpi strong{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi small{font-size:12.5px;font-weight:600;color:var(--mut)}.kpi em{display:block;font-style:normal;font-size:12px;line-height:1.35;color:var(--mut)}
.kpi svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.up{color:var(--c2)!important;font-weight:700}.dn{color:var(--c3)!important;font-weight:700}
.box{position:relative;flex:1;min-height:0}
.a{grid-area:a}.b{grid-area:b}.c{grid-area:c}
.r{grid-area:r;padding:0}
.rs{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.t1{flex:1.1}.t2{flex-direction:row;gap:16px;flex:1}.t3{flex:none;border:0}
.sp{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#fun{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;align-items:center}
.fb{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:6px;background:var(--b);color:var(--ft);font-weight:700;font-size:12px;cursor:pointer;min-width:120px;white-space:nowrap;transition:opacity .2s}
.fb:nth-child(2){color:#1A1A14}.fb span{font-weight:600;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{text-align:center;font-weight:700;color:var(--mut);padding:3px 6px;font-size:12px;white-space:nowrap}
td{text-align:center;padding:3px 6px;border:2px solid var(--card);white-space:nowrap;font-weight:600}
th:first-child,td:first-child{text-align:left}td:first-child{background:none;border-left:0}tbody tr{cursor:pointer}tr.on td:first-child{font-weight:800;text-decoration:underline}
@media (max-width:1100px){.app{height:auto;grid-template-columns:1fr}aside{border-radius:20px}.fl{display:grid;grid-template-columns:repeat(2,1fr);column-gap:10px}main{display:flex;flex-direction:column}.ks,.is{grid-template-columns:repeat(2,1fr)}.card.a,.card.b,.card.c{height:300px}.card.b{height:360px}.r{display:block}.rs{height:280px}.t3{height:auto;overflow-x:auto}.t2{height:300px}}
</style>
</head>

  </div>
  <div class="rs t3"><h2>Category performance</h2><table id="tbl"></table></div>
 </section>
</main>
</div>
